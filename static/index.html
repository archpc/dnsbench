<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNSBench — Resolver Field Diagnostics</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header id="topbar">
  <div class="brand"><span class="glyph">DNS</span><span class="sub">BENCH</span></div>
  <div id="stage-badge" class="stage-badge idle">idle</div>
  <div class="spacer"></div>
  <div id="run-stats" class="run-stats"></div>
</header>

<main>
  <section id="controls" class="panel">
    <h2>Run Control</h2>
    <form id="run-form">
      <label>Resolvers <input id="f-n" type="number" min="5" max="150" value="25"></label>
      <label>Workers <input id="f-workers" type="number" min="1" max="128" value="60"></label>
      <label>Timeout (s) <input id="f-timeout" type="number" min="0.5" max="5" step="0.5" value="2"></label>
      <label>Screening
        <select id="f-screening">
          <option value="skip">skip (use existing pool)</option>
          <option value="auto">auto (screen if no pool)</option>
          <option value="fresh">fresh (re-screen)</option>
        </select>
      </label>
      <button id="btn-run" type="submit">Run</button>
      <button id="btn-cancel" type="button" disabled>Cancel</button>
    </form>
    <div id="progress-wrap" class="progress-wrap" hidden>
      <div id="progress-bar"></div>
      <span id="progress-label"></span>
    </div>
    <div id="confirm-box" class="confirm-box" hidden>
      <p id="confirm-reason"></p>
      <button id="btn-confirm-yes">Confirm</button>
      <button id="btn-confirm-no">Abort</button>
    </div>
    <div id="job-error" class="job-error" hidden></div>
  </section>

  <section id="viz-section" class="panel">
    <h2>Resolver Field <span id="viz-meta" class="muted"></span></h2>
    <canvas id="viz-canvas"></canvas>
    <div id="viz-legend" class="legend"></div>
  </section>

  <section id="rank-section" class="panel">
    <h2>Rankings</h2>
    <div class="run-picker">
      <label>Run
        <select id="run-select"><option value="">— latest —</option></select>
      </label>
      <span id="run-badge" class="muted"></span>
    </div>
    <table id="rank-table">
      <thead><tr><th>#</th><th>IP</th><th>u_med</th><th>c_med</th><th>toU</th><th>toC</th><th>badC</th><th>Provider</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="history-section" class="panel">
    <h2>History</h2>
    <div class="run-picker">
      <label>A <select id="hist-a"></select></label>
      <label>B <select id="hist-b"></select></label>
      <button id="btn-compare" type="button">Compare</button>
    </div>
    <div id="compare-result" class="compare-result"></div>
  </section>

  <section id="providers-section" class="panel">
    <h2>Providers</h2>
    <table id="provider-table">
      <thead><tr><th>Provider</th><th>Count</th><th>Best u_med</th><th>Median u_med</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<footer id="statusline">
  <span id="status-text">connecting…</span>
</footer>

<script src="/app.js"></script>
</body>
</html>
